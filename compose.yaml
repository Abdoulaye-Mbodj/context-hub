name: context-hub

services:
  app:
    build:
      context: .
    ports:
      - "${CONTEXT_HUB_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://context_hub:${POSTGRES_PASSWORD:-context_hub}@db:5432/context_hub
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      DEMO_MODE: ${DEMO_MODE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-}
      ODOO_WEBHOOK_SECRET: ${ODOO_WEBHOOK_SECRET:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-development-key-change-me}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: context_hub
      POSTGRES_USER: context_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-context_hub}
    volumes:
      - context_hub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_hub -d context_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  context_hub_data:
